[mypy]
strict = True
check_untyped_defs = True
exclude = build/

# The z80 package is annotated but its release does not ship the
# py.typed marker yet; analyse it as it is.
[mypy-z80.*]
follow_untyped_imports = True

# appdirs is untyped; treat it as Any unconditionally.
[mypy-appdirs.*]
ignore_missing_imports = True
follow_imports = skip
