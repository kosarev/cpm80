name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4.2.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade pycodestyle ruff pytest mypy setuptools wheel z80 platformdirs
    - name: Run pycodestyle, ruff and mypy
      run: |
        pycodestyle .
        ruff check .
        mypy --config-file .mypy.ini cpm80 tests examples
    - name: Install the package
      run: |
        pip install .
    - name: Run tests
      run: |
        pytest tests
    - name: Run the examples
      run: |
        for e in examples/*.py; do python $e; done
